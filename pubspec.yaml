name: flutter_roadmap
description: "Your Personal Flutter Learning Journey"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons:
  flutter_localizations:
    sdk: flutter
  intl:
  firebase_core:
  firebase_auth:
  cloud_firestore:
  introduction_screen:
  flutter_svg:
  provider:
  shared_preferences:
  dio:
  flutter_screenutil:
  url_launcher:

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints:
  flutter_launcher_icons: ^0.14.0

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "assets/icon/ic_launcher_background.png"
  adaptive_icon_foreground: "assets/icon/ic_launcher_foreground.png"
  adaptive_icon_monochrome: "assets/icon/ic_launcher_monochrome.png"

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/icon/
